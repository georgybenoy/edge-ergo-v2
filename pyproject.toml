[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeergo"
version = "0.1.0"
description = "Privacy-preserving distributed Edge AI for ergonomic monitoring"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["edge_agent*", "central_server*"]
